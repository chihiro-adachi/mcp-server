name: PR Review

on:
  pull_request:
    types: [opened]

jobs:
  review:
    if: github.event.pull_request.user.login == 'chihiro-adachi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true

          prompt: "/review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}"
          claude_args: |
            --allowedTools "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" "Read" "Glob" "Grep" "Task" "WebFetch" "mcp__github_inline_comment__create_inline_comment"
